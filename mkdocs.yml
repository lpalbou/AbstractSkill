site_name: AbstractSkill
site_url: https://lpalbou.github.io/AbstractSkill/
repo_url: https://github.com/lpalbou/AbstractSkill
repo_name: lpalbou/AbstractSkill
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - API reference: api.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Trust model: trust.md
  - Skills catalog: skills-catalog.md
  - Skills vs workflows vs MCP: skills-flows-mcp.md
  - Trust-network position: trust-network-position.md
  - Changelog: changelog.md
  - Security: security.md

plugins:
  - search
