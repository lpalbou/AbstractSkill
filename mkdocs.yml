site_name: AbstractSkill
site_description: Agent Skills (SKILL.md) parsing, discovery, trust gating, and demand derivation for AbstractFramework.
site_url: https://www.lpalbou.info/AbstractSkill/
repo_url: https://github.com/lpalbou/AbstractSkill
repo_name: lpalbou/AbstractSkill
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - API reference: api.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Trust model: trust.md
  - Skills catalog: skills-catalog.md
  - Skills vs workflows vs MCP: skills-flows-mcp.md
  - Trust-network position: trust-network-position.md
  - Changelog: changelog.md
  - Security: security.md
